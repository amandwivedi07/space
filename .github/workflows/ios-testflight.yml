name: iOS → TestFlight

# Every push to main ships a build to TestFlight. Also runnable by hand from
# the Actions tab, which is the way to re-run an upload without an empty commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# One build at a time. Two concurrent runs would race for the same build
# number and the loser would be rejected by App Store Connect.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Kept in step with the Flutter version the app is developed against;
      # bump both together. A floating "stable" would let an upstream release
      # break a release build with no commit of ours to blame.
      FLUTTER_VERSION: "3.44.7"
      BUNDLE_ID: com.talkinspace.talkinspace

    steps:
      - uses: actions/checkout@v4

      # The image default is deliberately used rather than a pinned
      # /Applications/Xcode_NN.app path: those paths disappear when GitHub
      # re-images the runner, and a missing path fails the job instantly. The
      # version is logged so a build that breaks after an image update can be
      # traced to it.
      - name: Show toolchain
        run: xcodebuild -version && xcrun simctl --version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # A broken build should fail here, in two cheap minutes, rather than
      # after twenty minutes of archiving — or worse, in a tester's hands.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Without this, a missing secret surfaces twenty minutes later as
      # "xcodebuild: error: The flag -authenticationKeyID is required when
      # specifying -authenticationKeyPath" — which reads like a bug in this
      # workflow rather than an empty secret. Say the real thing, early.
      - name: Check credentials are configured
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$KEY_ID" ]      || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under" \
                 "Settings → Secrets and variables → Actions. See CI.md."
            exit 1
          fi
          case "$PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not look like a .p8." \
                    "Paste the file's full contents, BEGIN/END lines included — do not" \
                    "base64-encode it. See CI.md."; exit 1 ;;
          esac

      # The .p8 is the only credential this pipeline needs. It is written
      # outside the workspace so it can never be picked up by the archive, and
      # removed again in a step that runs even if the build fails.
      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # Asks Apple whether the three secrets actually work, before spending
      # four minutes compiling to find out. A wrong Issuer ID, a Key ID that
      # belongs to a different key, a revoked key and a key without the App
      # Manager role all surface at the archive as the same thing: a 401 buried
      # in xcodebuild output, followed by a misleading "No profiles were
      # found". This says which it is, in seconds, and prints no secret.
      - name: Verify the key and pick a build number
        id: build_number
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, tempfile, time, urllib.request, urllib.error

          key_id, issuer = os.environ["KEY_ID"], os.environ["ISSUER_ID"]
          path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          def b64(raw): return base64.urlsafe_b64encode(raw).rstrip(b"=")

          def der_to_raw(der):
              i = 2 if der[1] < 0x80 else 3 + (der[1] & 0x7F) - 1
              out = b""
              for _ in range(2):
                  ln = der[i + 1]
                  out += der[i + 2:i + 2 + ln].lstrip(b"\x00").rjust(32, b"\x00")
                  i += 2 + ln
              return out

          now = int(time.time())
          header = b64(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}).encode())
          claims = b64(json.dumps({
              "iss": issuer, "iat": now, "exp": now + 900,
              "aud": "appstoreconnect-v1",
          }).encode())
          signing_input = header + b"." + claims
          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(signing_input); tmp = f.name
          der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", path, tmp],
                               capture_output=True, check=True).stdout
          jwt = (signing_input + b"." + b64(der_to_raw(der))).decode()

          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/apps?limit=200",
              headers={"Authorization": f"Bearer {jwt}"})
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"Apple accepted the key (HTTP {r.status}).")
                  apps = json.load(r).get("data", [])
              # Bundle ids are not secret, and seeing the list is the whole
              # diagnosis when Xcode says "No Account for Team": a key that
              # belongs to a different Apple account authenticates perfectly
              # and then cannot sign for this team.
              ids = sorted(a["attributes"]["bundleId"] for a in apps)
              print(f"This key can see {len(ids)} app(s):")
              for b in ids:
                  print(f"  - {b}")
              want = os.environ["BUNDLE_ID"]
              if want not in ids:
                  print(f"::error::This key's account cannot see {want}. That is why"
                        " the archive reports 'No Account for Team' — the key is valid"
                        " but belongs to a different Apple Developer account, or the"
                        " app has not been created in App Store Connect yet. Either"
                        " create the app there, or issue the API key from the account"
                        " that owns the app.")
                  raise SystemExit(1)
              print(f"{want} is visible to this key.")

              # pubspec.yaml owns the build number, for iOS exactly as it
              # already does for Android — one number, both stores, bumped
              # deliberately. It was 100 + run_number at first, justified with
              # "nothing has ever been uploaded for this bundle id", which was
              # never checked and was false; that is how build 114 came to sit
              # next to a 13.
              #
              # Apple only requires the number to be unique and rising WITHIN a
              # marketing version, so this checks that train and says exactly
              # what to bump rather than letting the upload fail ten minutes
              # later.
              spec = open("pubspec.yaml").read()
              m = re.search(r"^version:\s*([0-9.]+)\+([0-9]+)\s*$", spec, re.M)
              if not m:
                  print("::error::Could not read 'version: x.y.z+N' from pubspec.yaml.")
                  raise SystemExit(1)
              name, number = m.group(1), int(m.group(2))
              print(f"pubspec says {name}+{number}")

              app_id = next(a["id"] for a in apps
                            if a["attributes"]["bundleId"] == want)
              r3 = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/builds"
                  f"?filter[app]={app_id}&include=preReleaseVersion&limit=200",
                  headers={"Authorization": f"Bearer {jwt}"})
              with urllib.request.urlopen(r3) as resp:
                  payload = json.load(resp)
              trains = {inc["id"]: inc["attributes"]["version"]
                        for inc in payload.get("included", [])
                        if inc["type"] == "preReleaseVersions"}
              # Print everything Apple holds, grouped by marketing version. It
              # is the answer to "what build number is safe" and to "did the
              # last upload actually land" — a build takes a few minutes to
              # appear after altool reports success.
              held = {}
              for b in payload.get("data", []):
                  rel = (b.get("relationships", {}).get("preReleaseVersion", {})
                          .get("data") or {}).get("id")
                  v = b["attributes"].get("version")
                  held.setdefault(trains.get(rel, "?"), []).append(v)
              for train in sorted(held):
                  nums = ", ".join(sorted(held[train], key=lambda x: int(x)
                                          if x and x.isdigit() else 0))
                  print(f"  Apple holds {train}: {nums}")

              same_train = []
              for b in payload.get("data", []):
                  rel = (b.get("relationships", {}).get("preReleaseVersion", {})
                          .get("data") or {}).get("id")
                  v = b["attributes"].get("version")
                  if trains.get(rel) == name and v and v.isdigit():
                      same_train.append(int(v))

              if same_train:
                  print(f"{name} already has build(s): "
                        f"{', '.join(str(n) for n in sorted(same_train))}")
                  if number <= max(same_train):
                      print(f"::error::pubspec has {name}+{number}, but Apple already"
                            f" holds build {max(same_train)} for {name}. Within one"
                            " marketing version a build number must be higher than"
                            " every previous one. Bump the +N in pubspec.yaml past"
                            f" {max(same_train)}, or move to a new version — a fresh"
                            " version number starts its own sequence.")
                      raise SystemExit(1)
              else:
                  print(f"{name} has no builds yet; {number} starts its sequence.")

              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"value={number}\n")

              # The archive says "No Account for Team". Two things cause that
              # and they need different fixes: the team id pinned in the Xcode
              # project belongs to a different account, or the key cannot act
              # on signing assets because its role is too low. Reading a
              # provisioning endpoint separates them — and a profile carries
              # the real team id inside it, which is the value the project
              # should be pinning.
              for path in ("certificates", "profiles"):
                  r2 = urllib.request.Request(
                      f"https://api.appstoreconnect.apple.com/v1/{path}?limit=200",
                      headers={"Authorization": f"Bearer {jwt}"})
                  try:
                      with urllib.request.urlopen(r2) as resp:
                          data = json.load(resp).get("data", [])
                      print(f"{path}: readable, {len(data)} found")
                      if path == "profiles":
                          import plistlib, re as _re
                          teams = set()
                          for prof in data:
                              raw = prof["attributes"].get("profileContent")
                              if not raw:
                                  continue
                              blob = base64.b64decode(raw)
                              m = _re.search(rb"<plist.*?</plist>", blob, _re.S)
                              if not m:
                                  continue
                              pl = plistlib.loads(m.group(0))
                              teams.update(pl.get("TeamIdentifier", []))
                          if teams:
                              print(f"Team id(s) this account actually signs with: "
                                    f"{', '.join(sorted(teams))}")
                              if "NZH7T8Y3FC" not in teams:
                                  print("::error::ios/Runner.xcodeproj and"
                                        " ios/ExportOptions.plist pin DEVELOPMENT_TEAM"
                                        " NZH7T8Y3FC, which is not a team this key can"
                                        " sign for. That is the 'No Account for Team'"
                                        " error. Use one of the ids above.")
                  except urllib.error.HTTPError as e2:
                      print(f"{path}: HTTP {e2.code}")
                      if e2.code == 403:
                          print("::error::The key cannot read signing assets (403)."
                                " -allowProvisioningUpdates has to create a"
                                " distribution certificate and profile, which needs"
                                " the App Manager or Admin role. Re-issue the key with"
                                " App Manager.")
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:400]
              if e.code == 401:
                  print("::error::Apple rejected the credentials (401). One of the three"
                        " secrets is wrong: the Issuer ID, the Key ID, or a private key"
                        " that does not belong to that Key ID. A revoked key looks the"
                        " same. Re-copy all three together from App Store Connect →"
                        " Users and Access → Integrations. See CI.md.")
              elif e.code == 403:
                  print("::error::The key is valid but not permitted (403). The archive"
                        " signs itself with -allowProvisioningUpdates, which needs to"
                        " create a distribution certificate and profile — that requires"
                        " the App Manager role. A Developer-role key is refused.")
              else:
                  print(f"::error::Apple answered HTTP {e.code} while checking the key.")
              print(f"Apple said: {body}")
              raise SystemExit(1)
          PY

      # A runner is destroyed after every build, so the certificate the last
      # run created is already useless — its private key went with the machine.
      # -allowProvisioningUpdates therefore mints a fresh one every time, and
      # Apple caps how many an account may hold; builds 60-62 each took a slot
      # and 63 hit the wall with "Choose a certificate to revoke".
      #
      # This revokes only the ones CI made ("Created via API"). Nobody can sign
      # with them: every matching private key died with the runner that asked
      # for it. Certificates a person created on their own Mac are left alone.
      - name: Reclaim certificate slots CI used up
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, tempfile, time, urllib.request, urllib.error

          key_id, issuer = os.environ["KEY_ID"], os.environ["ISSUER_ID"]
          path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          def b64(raw): return base64.urlsafe_b64encode(raw).rstrip(b"=")

          def der_to_raw(der):
              i = 2 if der[1] < 0x80 else 3 + (der[1] & 0x7F) - 1
              out = b""
              for _ in range(2):
                  ln = der[i + 1]
                  out += der[i + 2:i + 2 + ln].lstrip(b"\x00").rjust(32, b"\x00")
                  i += 2 + ln
              return out

          now = int(time.time())
          header = b64(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}).encode())
          claims = b64(json.dumps({"iss": issuer, "iat": now, "exp": now + 900,
                                   "aud": "appstoreconnect-v1"}).encode())
          si = header + b"." + claims
          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(si); tmp = f.name
          der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", path, tmp],
                               capture_output=True, check=True).stdout
          jwt = (si + b"." + b64(der_to_raw(der))).decode()

          def call(method, path_):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path_, method=method,
                  headers={"Authorization": f"Bearer {jwt}"})
              try:
                  with urllib.request.urlopen(req) as r:
                      body = r.read()
                      return r.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  return e.code, {}

          status, data = call("GET", "/v1/certificates?limit=200")
          if status != 200:
              print(f"::warning::Could not list certificates (HTTP {status}); "
                    "leaving them alone and letting the archive try.")
              raise SystemExit(0)

          certs = data.get("data", [])
          print(f"The account holds {len(certs)} certificate(s).")

          # "Created via API" is the display name Apple gives a certificate
          # minted by -allowProvisioningUpdates. It is the signature of a CI
          # run, and the only kind safe to revoke unattended.
          ours = [c for c in certs
                  if "Created via API" in (c["attributes"].get("displayName") or "")]
          mine = [c for c in certs if c not in ours]
          for c in mine:
              a = c["attributes"]
              print(f"  keeping {a.get('certificateType')}: "
                    f"{a.get('displayName')} (not CI's)")

          if not ours:
              print("Nothing of CI's to reclaim.")
              raise SystemExit(0)

          for c in ours:
              a = c["attributes"]
              code, _ = call("DELETE", f"/v1/certificates/{c['id']}")
              state = "revoked" if code in (204, 200) else f"HTTP {code}"
              print(f"  {state}: {a.get('certificateType')} "
                    f"{a.get('displayName')} (expires {a.get('expirationDate')})")
          print(f"Reclaimed {len(ours)} slot(s); the archive will mint a fresh one.")
          PY

      # Compiles the Dart and runs pod install. Signing is deliberately skipped
      # here: xcodebuild signs during archive, where the API key is available.
      - name: Build Flutter iOS bundle
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.build_number.outputs.value }}

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" -maxdepth 1 | head -1)
          if [ -z "$IPA" ]; then echo "::error::no .ipa was exported"; exit 1; fi
          echo "uploading $(basename "$IPA")"
          # altool reads the key from one of a few fixed directories rather
          # than a path argument, which is why it was written to ~/private_keys.
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # Keeps the exact artifact that went to Apple, so a build can be
      # inspected later without reconstructing it from a commit.
      - name: Keep the IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-${{ steps.build_number.outputs.value }}.ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Remove the API key
        if: always()
        run: rm -rf ~/private_keys
