name: space_flutter
description: "Space — an ephemeral private messenger. Conversations are temporary, memories are intentional."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.1
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
